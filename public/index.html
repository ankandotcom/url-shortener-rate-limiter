<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trim.ly — URL Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="./images/trim.png">
</head>

<body>
  <div class="bg-wrapper">
    <div class="bg-grid"></div>
  </div>

  <div class="content max-w-3xl mx-auto px-4 py-12">

    <!-- Header -->
    <header class="mb-12">
      <div class="flex items-center gap-3 mb-2">        
        <h1 class="text-4xl font-extrabold tracking-tight" style="font-family:'Syne',sans-serif">
          Trim<span style="color:var(--accent)">.ly</span>
        </h1>
      </div>
      <p class="mono text-sm" style="color:var(--muted)">A URL shortener with rate limiter.</p>
    </header>

    <!-- Shorten Form -->
    <section class="mb-8">
      <div class="rounded-xl p-6" style="background:var(--surface);border:1px solid var(--border)">
        <h2 class="text-lg font-semibold mb-4">Shorten a URL</h2>

        <div class="flex flex-col gap-3">
          <input id="longUrl" type="url" placeholder="https://your-very-long-url.com/with/a/long/path"
            class="url-input w-full px-4 py-3 rounded-lg" />

          <div class="flex items-center gap-3">
            <span class="mono text-sm whitespace-nowrap" style="color:var(--muted)">localhost:5000/</span>
            <input id="customSlug" type="text" placeholder="custom-slug (optional)" maxlength="20"
              class="url-input flex-1 px-4 py-3 rounded-lg" />
          </div>

          <button id="shortenBtn" onclick="shortenUrl()" class="btn-primary w-full py-3 rounded-lg uppercase">
            Shorten URL
          </button>
        </div>

        <!-- Rate limit indicator -->
        <div class="mt-4" id="rateLimitBar" style="display:none">
          <div class="flex justify-between mono text-xs mb-1" style="color:var(--muted)">
            <span>Rate Limit</span>
            <span id="rateLimitText">0 / 10 requests used</span>
          </div>
          <div class="h-1 rounded-full overflow-hidden" style="background:#1a1a1a">
            <div id="rateFill" class="rate-bar-fill h-full rounded-full" style="width:0%"></div>
          </div>
          <p class="mono text-xs mt-1" style="color:var(--muted)">Resets every 15 minutes · 10 requests max</p>
        </div>
      </div>
    </section>

    <!-- Result Card -->
    <div id="resultCard" class="result-card rounded-xl p-5 mb-8" style="display:none">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-bold uppercase tracking-widest" style="color:var(--accent)">✓ Shortened</span>
        <span id="cachedBadge" class="mono text-xs px-2 py-1 rounded"
          style="background:#1a1a1a;display:none">cached</span>
      </div>

      <div class="flex items-center gap-3 mb-4">
        <a id="shortUrlLink" href="#" target="_blank" class="mono text-lg font-bold flex-1 truncate"
          style="color:var(--accent)">—</a>
        <button onclick="copyUrl()" class="mono text-xs px-3 py-2 rounded border"
          style="border-color:var(--border);color:var(--muted);transition:all 0.2s"
          onmouseenter="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
          onmouseleave="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
          COPY
        </button>
      </div>

      <p class="mono text-xs truncate mb-4" style="color:var(--muted)" id="originalUrlPreview">—</p>

      <div class="flex gap-6 mono text-xs" style="color:var(--muted)">
        <span>📊 <span id="clickCount">0</span> clicks</span>
        <span>🕒 <span id="createdAt">—</span></span>
      </div>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" class="rounded-lg px-5 py-4 mb-8 mono text-sm"
      style="display:none;background:#1a0000;border:1px solid #ff3333;color:#ff6666"></div>

    <!-- Tabs -->
    <section>
      <div class="flex gap-0 border-b mb-6" style="border-color:var(--border)">
        <button onclick="switchTab('history')" id="tab-history"
          class="tab-btn active px-5 py-3 mono text-sm">History</button>
        <button onclick="switchTab('stats')" id="tab-stats" class="tab-btn px-5 py-3 mono text-sm">Stats Lookup</button>
      </div>

      <!-- History Tab -->
      <div id="panel-history">
        <div class="flex justify-between items-center mb-4">
          <p class="mono text-xs" style="color:var(--muted)">Recent shortened URLs</p>
          <button onclick="loadUrls()" class="mono text-xs" style="color:var(--accent)">↺ Refresh</button>
        </div>
        <div id="urlList">
          <p class="mono text-sm text-center py-8" style="color:var(--muted)">No URLs yet. Shorten one above!</p>
        </div>
      </div>

      <!-- Stats Lookup Tab -->
      <div id="panel-stats" style="display:none">
        <div class="flex gap-3">
          <input id="statsCode" type="text" placeholder="Enter short code (e.g. abc1234)"
            class="url-input flex-1 px-4 py-3 rounded-lg" />
          <button onclick="lookupStats()" class="btn-primary px-6 py-3 rounded-lg uppercase">
            Look Up
          </button>
        </div>
        <div id="statsResult" class="mt-5"></div>
      </div>
    </section>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 hidden mono text-sm px-5 py-3 rounded-lg"
    style="background:var(--accent);color:#000;font-weight:700;z-index:100">
    Copied!
  </div>

  <script src="script.js"></script>
</body>

</html>
